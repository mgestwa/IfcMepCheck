[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mepcheck"
dynamic = ["version"]
description = "Rule-based quality checks for MEP/HVAC IFC models with JSON, HTML and BCF reports"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mateusz Gestwa" }]
keywords = ["ifc", "bim", "mep", "hvac", "bcf", "model-checking"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "ifcopenshell>=0.9,<0.10",
    "pydantic>=2.7,<3",
    "rich>=13.8",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
mepcheck = "mepcheck.cli:app"

[project.urls]
Repository = "https://github.com/mgestwa/IfcMepCheck"

[tool.hatch.version]
path = "src/mepcheck/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mepcheck"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"mcp.server.fastmcp".msg = "mcp 2.x renamed FastMCP: use mcp.server.mcpserver.MCPServer"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["mepcheck"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]
